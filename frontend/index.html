<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mid-meet</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260606-map-background" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-panel" aria-label="Kakao Map">
        <div id="kakao-map" class="kakao-map" role="img" aria-label="Kakao Map"></div>
        <div id="map-fallback" class="map-fallback" hidden>
          <strong>Kakao 지도 도메인 등록이 필요합니다</strong>
          <p>
            Kakao Developers의 Web 플랫폼에 http://localhost:8000 과
            http://127.0.0.1:8000 을 등록하면 지도가 표시됩니다.
          </p>
        </div>
      </section>

      <section class="workspace overlay-panel" aria-label="추천 요청">
        <header class="topbar">
          <div>
            <p class="eyebrow">mid-meet</p>
            <h1>중간역 기반 장소 추천</h1>
          </div>
          <a class="docs-link" href="/docs" target="_blank" rel="noreferrer">
            API Docs
          </a>
        </header>

        <form id="recommend-form" class="request-panel">
          <div class="field-row">
            <label for="query">찾는 장소</label>
            <input
              id="query"
              name="query"
              type="text"
              value="조용한 카페"
              autocomplete="off"
              required
            />
          </div>

          <div class="field-row compact">
            <label for="top-k">추천 개수</label>
            <input id="top-k" name="top_k" type="number" min="1" max="20" value="3" />
          </div>

          <section class="locations-block" aria-label="출발역">
            <div class="section-heading">
              <h2>출발역</h2>
              <button
                class="icon-button"
                id="add-location"
                type="button"
                aria-label="출발역 추가"
                title="출발역 추가"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </button>
            </div>
            <div id="locations" class="locations-list"></div>
          </section>

          <div class="action-row">
            <button id="submit-button" class="primary-button" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m16 16 4 4" />
              </svg>
              추천 받기
            </button>
            <button id="sample-button" class="secondary-button" type="button">
              예시 입력
            </button>
          </div>
        </form>
      </section>

      <aside class="result-panel overlay-panel" aria-label="추천 결과">
        <div class="map-toolbar">
          <div>
            <p class="eyebrow">Kakao Map</p>
            <h2 id="map-title">서울역 조용한 카페</h2>
          </div>
          <a
            id="map-open-link"
            class="map-open-link"
            href="https://map.kakao.com/link/search/%EC%84%9C%EC%9A%B8%EC%97%AD%20%EC%A1%B0%EC%9A%A9%ED%95%9C%20%EC%B9%B4%ED%8E%98"
            target="_blank"
            rel="noreferrer"
          >
            지도에서 열기
          </a>
        </div>
        <div id="status-strip" class="status-strip">요청 대기 중</div>

        <div class="result-header">
          <div>
            <p class="eyebrow">Result</p>
            <h2 id="result-title">아직 결과가 없습니다</h2>
          </div>
          <button
            id="clear-button"
            class="icon-button"
            type="button"
            aria-label="결과 초기화"
            title="결과 초기화"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div id="result-content" class="result-content empty-state">
          <p>출발역과 원하는 장소를 입력하면 추천 결과가 표시됩니다.</p>
        </div>
      </aside>
    </main>

    <script src="/static/app.js?v=20260606-map-background" type="module"></script>
  </body>
</html>
